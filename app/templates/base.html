<!DOCTYPE html>
<html lang="en">
<head>
    {% block metadata %}<meta charset="UTF-8">{% endblock %}
    <title>{% block title %}JobScraper6000{% endblock %}</title>
    {% block links %}
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css')}}">
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    {% endblock %}
</head>
<body class="layout">
    <header>
    <nav class="navbar">
        <a href="{{ url_for('settings_panel') }}" class="nav-left">
            <img id="arrow_back" src="{{ url_for('static', filename='images/arrow_back2.png')}}" alt="Link image">
        </a>
        <div class="nav-center">
            <img id="logo" src="{{ url_for('static', filename='images/jobscraper_logo.png') }}" alt="JobScraper Logo">
            <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank"><h1 class="apptitle">JobScraper6000</h1></a>
        </div>
        <div class="nav-right">
            <img id="settings" src="{{ url_for('static', filename='images/settings.png')}}" alt="Settings Logo">
        </div>
    </nav>
</header>
    <main class="layout"></main>


{% block content %}
{% endblock %}
</body>
</html>
